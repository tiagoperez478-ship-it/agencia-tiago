</head>
<body>

    <!-- NAVBAR DE BOOTSTRAP -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg navbar-dark header-bootstrap">
            <div class="container-fluid px-4">
                <a class="navbar-brand logo-marca" href="../index.html"><strong>TP Studio</strong></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav gap-lg-3">
                        <li class="nav-item"><a class="nav-link nav-enlace" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link nav-enlace" href="sobre-mi.html">Nosotros</a></li>

                        <li class="nav-item"><a class="nav-link nav-enlace active" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-layout">
        <section class="tarjeta-destacada">
            <h1>Contacto Directo</h1>
            <p>Comunicate con nosotros para cotizar tu próximo proyecto digital.</p>
        </section>

        <section class="tarjeta-destacada">
            <h2>Envianos tu consulta</h2>
            <form class="formulario-contacto" action="#" method="POST">
                <div class="campo-form">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="campo-form">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Ej: juan@ejemplo.com" required>
                </div>

                <div class="campo-form">
                    <label for="mensaje">Mensaje o consulta</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Contanos sobre tu proyecto..." required></textarea>
                </div>

                <button type="submit" class="boton-principal">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer class="footer-principal">
        <p>&copy; 2026 TP Studio. Todos los derechos reservados.</p>

            <li><a class="footer-enlace" href="https://www.linkedin.com/in/tiago-perez-0bee0031b/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        </ul>
